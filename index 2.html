<title>Nouvelle Ferme Cuniculture Pro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Concept : carnet de ferme sur téléphone. Barre d'onglets en bas, feuilles de saisie qui montent du bas, vert forêt + jaune paille. */
:root{
  --bg:#f2f4ef;--surface:#fbfcf9;--ink:#14231c;--muted:#5c6b62;--line:#d9dfd5;
  --brand:#0f4a38;--brand-ink:#ffffff;--accent:#d99a00;--tint:#e4ebe2;
  --good:#2f7d4f;--warn:#a86400;--bad:#b3372b;
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1713;--surface:#15221c;--ink:#e8efe9;--muted:#96a89d;--line:#26362e;
  --brand:#6fcf9f;--brand-ink:#08231a;--accent:#f0b429;--tint:#1c2c24;
  --good:#6fcf9f;--warn:#f0b429;--bad:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1713;--surface:#15221c;--ink:#e8efe9;--muted:#96a89d;--line:#26362e;
  --brand:#6fcf9f;--brand-ink:#08231a;--accent:#f0b429;--tint:#1c2c24;
  --good:#6fcf9f;--warn:#f0b429;--bad:#ff8a7a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:1px solid var(--line)}
header.top .name{flex:1;min-width:0}
header.top h1{font-size:18px;font-weight:800}
header.top .sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.dot.off{background:var(--warn)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--brand);background:var(--tint)}
section.blk{margin-top:18px}
.h2row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.h2row h2{font-size:17px;font-weight:800}
.small{font-size:12.5px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.row .main{min-width:0;flex:1}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row .end{text-align:right;font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .v{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;overflow-wrap:anywhere}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.hero{grid-column:1/-1;background:var(--brand);color:var(--brand-ink);border-color:transparent}
.kpi.hero .l{color:inherit;opacity:.8}
.kpi.hero .v{font-size:40px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--tint);color:var(--ink);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.seg{display:flex;gap:4px;background:var(--tint);padding:4px;border-radius:12px;margin-top:14px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.filters{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.filters select{flex:1;min-width:120px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;min-height:44px}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.dng{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:6px 10px;min-height:36px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;
  background:var(--accent);color:#1a1300;border:0;border-radius:999px;padding:0 20px;height:50px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25)}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:72px;resize:vertical}
label.f{display:block;margin-top:12px;font-size:13px;font-weight:600}
label.f .hint{font-weight:400;color:var(--muted)}
label.f input,label.f select,label.f textarea{margin-top:4px;font-weight:400}
label.chk{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:600}
label.chk input{width:22px;height:22px;min-height:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
#sheet .back{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto}
#sheet .pane h2{font-size:20px;font-weight:800;margin-bottom:4px}
.banner{margin-top:12px;border:1px dashed var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:12px;padding:10px 12px;font-size:13px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left-width:4px}
.alert.warn{border-left-color:var(--warn)}.alert.bad{border-left-color:var(--bad)}.alert.good{border-left-color:var(--good)}.alert.info{border-left-color:var(--brand)}
.bar{height:8px;border-radius:99px;background:var(--tint);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.scroll-x{overflow-x:auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:700;text-align:right;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:22px 10px;border:1px dashed var(--line);border-radius:14px}
.chart text{fill:var(--muted);font:11px var(--body)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90%}
@media (prefers-reduced-motion:no-preference){#sheet.open .pane{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="name"><h1>Nouvelle Ferme</h1><div class="sub"><span class="dot" id="dot"></span><span id="status">Données sur cet appareil</span></div></div>
    <button class="icon-btn" id="gear" aria-label="Paramètres et sauvegarde">⚙</button>

  <main id="view"></main>
</div>

<div id="sheet"><div class="back" id="sheetBack"></div><div class="pane" id="pane" role="dialog" aria-modal="true"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){'use strict';
var KEY='nfcp-pro-v1',storageOk=true;
/* ---------- utilitaires ---------- */
function uid(p){return p+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3)}
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function addDays(s,n){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5)}
function fdate(s){if(!s)return '—';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function num(n,d){return new Intl.NumberFormat('fr-FR',{maximumFractionDigits:d==null?0:d}).format(n||0).replace(/[  ]/g,' ')}
function money(n){return num(Math.round(n||0))+' FCFA'}
function kgs(g){return num(g/1000,2)+' kg'}
function gr(g){return num(g)+' g'}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function sum(a,k){var t=0;for(var i=0;i<a.length;i++)t+=Number(k?a[i][k]:a[i])||0;return t}
function by(a,k){return a.slice().sort(function(x,y){return x[k]<y[k]?-1:x[k]>y[k]?1:0})}
function pct(n,d){return d>0?Math.round(n/d*1000)/10:null}
function fpct(v){return v==null?'—':num(v,1)+' %'}

/* ---------- données ---------- */
var S;
function defaults(){return{v:1,demo:false,lastBackup:null,
  settings:{ferme:'Nouvelle Ferme',cibleCarcasse:1,rendement:55,gestation:31,palpation:12,sevrage:35,intervallePesee:7,prixAliment:350,repartition:'effectif',

  animals:[],lots:[],weighings:[],events:[],feeds:[],breedings:[],abattages:[],sales:[],expenses:[],incomes:[],log:[],stock:[],mvts:[],health:[]}}

  s.feeds.forEach(function(f){f.itemId='s1'});
  s.health=[
    {id:'h1',date:d(20),lotId:'l1',animalId:'',type:'traitement',symptomes:'Diarrhée chez plusieurs lapereaux',diagnostic:'À confirmer',diagnosticPar:'Vétérinaire (exemple)',produit:'Produit vétérinaire (exemple)',dosage:'Selon l’ordonnance',duree:5,delai:7,responsable:'Agent d’élevage',suivi:d(13),done:true,resultat:'Amélioration après 3 jours'},
    {id:'h2',date:d(2),lotId:'l2',animalId:'',type:'vaccination',symptomes:'',diagnostic:'',diagnosticPar:'',produit:'Vaccin (exemple)',dosage:'Selon la notice',duree:0,delai:0,responsable:'Agent d’élevage',suivi:addDays(t,2),done:false,resultat:''},
    {id:'h3',date:d(3),lotId:'l2',animalId:'',type:'traitement',symptomes:'Éternuements',diagnostic:'À confirmer',diagnosticPar:'Vétérinaire (exemple)',produit:'Produit vétérinaire (exemple)',dosage:'Selon l’ordonnance',duree:3,delai:10,responsable:'Agent d’élevage',suivi:'',done:false,resultat:''}];
  s.p2=true}
function seed(){
  var t=today(),d=function(n){return addDays(t,-n)},s=defaults();s.demo=true;
  s.animals=[
    {id:'a1',num:'M-001',nom:'Tarzan',sexe:'M',race:'Néo-zélandais',couleur:'Blanc',naissance:d(300),origine:'Né à la ferme',entree:d(300),cage:'R-01',pere:'',mere:'',statut:'reproducteur',poids:3900,notes:''},
    {id:'a2',num:'F-001',nom:'Awa',sexe:'F',race:'Néo-zélandais',couleur:'Blanc',naissance:d(330),origine:'Acheté',entree:d(260),cage:'R-02',pere:'',mere:'',statut:'reproducteur',poids:4100,notes:''},
    {id:'a3',num:'F-002',nom:'Mariam',sexe:'F',race:'Californien',couleur:'Blanc, oreilles noires',naissance:d(310),origine:'Acheté',entree:d(260),cage:'R-03',pere:'',mere:'',statut:'reproducteur',poids:3800,notes:''},
    {id:'a4',num:'F-003',nom:'Fanta',sexe:'F',race:'Néo-zélandais',couleur:'Blanc',naissance:d(240),origine:'Né à la ferme',entree:d(240),cage:'R-04',pere:'a1',mere:'a2',statut:'reproducteur',poids:3700,notes:''}];
  s.lots=[
    {id:'l0',num:'L-000',constitution:d(80),origine:'Portée F-001',initial:20,naissance:d(115),poidsInit:800,categorie:'Engraissement',cage:'Bât. 1',notes:''},
    {id:'l1',num:'L-001',constitution:d(28),origine:'Portées F-001 et F-002',initial:22,naissance:d(63),poidsInit:800,categorie:'Engraissement',cage:'Bât. 1',notes:''},
    {id:'l2',num:'L-002',constitution:d(10),origine:'Portée F-003',initial:18,naissance:d(45),poidsInit:800,categorie:'Engraissement',cage:'Bât. 2',notes:''}];
  var w=function(l,n,g,m){s.weighings.push({id:uid('w'),lotId:l,date:d(n),n:m||10,g:g})};
  w('l1',21,1050);w('l1',14,1330);w('l1',7,1600);w('l1',1,1750);w('l2',3,1030);w('l0',60,1250);w('l0',40,1650);w('l0',20,1840);
  var e=function(l,n,k,c){s.events.push({id:uid('e'),type:'mort',lotId:l,date:d(n),n:k,cause:c})};
  e('l1',20,1,'Diarrhée');e('l1',9,1,'Indéterminée');e('l2',5,1,'Indéterminée');e('l0',50,1,'Coup de chaleur');
  var f=function(l,n,k){s.feeds.push({id:uid('f'),lotId:l,date:d(n),kg:k})};
  f('l1',21,12);f('l1',14,16);f('l1',7,20);f('l1',1,22);f('l2',6,5);f('l2',2,8);
  s.breedings=[
    {id:'b0',femelle:'a2',male:'a1',saillie:d(110),palpation:'positif',miseBas:d(79),nes:9,mortNes:0,sevrageDate:d(44),sevres:8,gardes:1,mortAvant:1,notes:''},
    {id:'b00',femelle:'a3',male:'a1',saillie:d(100),palpation:'positif',miseBas:d(69),nes:7,mortNes:1,sevrageDate:d(34),sevres:5,gardes:0,mortAvant:1,notes:''},
    {id:'b1',femelle:'a2',male:'a1',saillie:d(40),palpation:'positif',miseBas:d(9),nes:8,mortNes:1,sevrageDate:'',sevres:0,gardes:0,mortAvant:0,notes:''},
    {id:'b2',femelle:'a3',male:'a1',saillie:d(14),palpation:'attente',miseBas:'',nes:0,mortNes:0,sevrageDate:'',sevres:0,gardes:0,mortAvant:0,notes:''},
    {id:'b3',femelle:'a4',male:'a1',saillie:d(31),palpation:'positif',miseBas:'',nes:0,mortNes:0,sevrageDate:'',sevres:0,gardes:0,mortAvant:0,notes:''}];
  s.abattages=[{id:'ab1',lotId:'l0',date:d(12),n:14,vif:25.9,carcasse:14.2,pertes:0,notes:''}];
  s.sales=[
    {id:'v1',num:'V-0001',date:d(15),client:'Restaurant Le Baobab',tel:'',cat:'vif',lotId:'l0',animalId:'',qte:5,poids:0,prixUnit:5000,remise:0,encaisse:25000,mode:'Espèces',resp:'Patron',force:false},
    {id:'v2',num:'V-0002',date:d(11),client:'Mme Koné',tel:'',cat:'carcasse',lotId:'l0',animalId:'',qte:5,poids:1.0,prixUnit:5500,remise:0,encaisse:20000,mode:'Mobile money',resp:'Patron',force:false}];
  var x=function(n,c,m,l){s.expenses.push({id:uid('x'),date:d(n),cat:c,montant:m,note:'',lotId:l||''})};
  x(100,'Achat de reproducteurs',45000);x(20,'Aliments',87500);x(6,'Aliments',70000);x(8,'Produits vétérinaires',8500,'l1');
  x(5,'Main-d’œuvre',30000);x(4,'Eau et électricité',12000);x(3,'Transport',5000);
  seedPhase2(s);
  return s}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.v===1)return o}}catch(e){storageOk=false}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true}catch(e){storageOk=false}}
function logOp(t){S.log.unshift({d:new Date().toISOString(),t:t});if(S.log.length>200)S.log.length=200}
S=load()||seed();
(function(){var d=defaults();['stock','mvts','health','incomes','log'].forEach(function(k){if(!S[k])S[k]=d[k]});
  if(S.demo&&!S.p2&&!S.stock.length&&!S.mvts.length&&!S.health.length)seedPhase2(S);S.p2=true})();

/* ---------- calculs ---------- */
var CATS_DEP=['Aliments','Achat de reproducteurs','Produits vétérinaires','Main-d’œuvre','Eau et électricité','Transport','Entretien des installations','Autres charges'];
var CAT_LABEL={vif:'Lapin vivant',abattu:'Lapin abattu',carcasse:'Carcasse (par poids)',reproducteur:'Reproducteur',sevre:'Lapereau sevré'};
function cfg(){return S.settings}
function targetLive(){return cfg().cibleCarcasse*1000/(cfg().rendement/100)}
function find(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function lotLabel(id){var l=find(S.lots,id);return l?l.num:'—'}
function animalLabel(id){var a=find(S.animals,id);return a?(a.num+(a.nom?' · '+a.nom:'')):'—'}
function lotStats(l){
  var ev=S.events.filter(function(e){return e.lotId===l.id});
  var morts=sum(ev.filter(function(e){return e.type==='mort'}),'n');
  var out=sum(ev.filter(function(e){return e.type==='sortie'}),'n');
  var inn=sum(ev.filter(function(e){return e.type==='entree'}),'n');
  var abs=S.abattages.filter(function(a){return a.lotId===l.id});
  var ab=sum(abs,'n'),pertes=sum(abs,'pertes');
  var sv=S.sales.filter(function(s){return s.lotId===l.id});
  var sold=sum(sv.filter(function(s){return s.cat==='vif'||s.cat==='sevre'}),'qte');
  var soldC=sum(sv.filter(function(s){return s.cat==='carcasse'||s.cat==='abattu'}),'qte');
  var present=l.initial+inn-out-morts-ab-sold;
  var pts=[{date:l.constitution,g:l.poidsInit}].concat(by(S.weighings.filter(function(w){return w.lotId===l.id}),'date').map(function(w){return{date:w.date,g:w.g,n:w.n}}));
  var last=pts[pts.length-1],ref=pts[Math.max(0,pts.length-3)],dd=diff(last.date,ref.date);
  var gmq=dd>0?(last.g-ref.g)/dd:0,tg=targetLive(),est=null;
  if(gmq>0&&last.g<tg)est=addDays(last.date,Math.ceil((tg-last.g)/gmq));
  var fed=sum(S.feeds.filter(function(f){return f.lotId===l.id}),'kg');
  return{present:present,morts:morts,inn:inn,out:out,ab:ab,pertes:pertes,sold:sold,carcStock:ab-pertes-soldC,pts:pts,last:last,gmq:gmq,est:est,
    ready:present>0&&last.g>=tg,mort:pct(morts,l.initial+inn),fed:fed,
    age:l.naissance?diff(today(),l.naissance):null,sinceWeigh:diff(today(),last.date)}}
function salesNet(s){return (Number(s.qte)||0)*(Number(s.prixUnit)||0)-(Number(s.remise)||0)}
function periodStart(){var p=UI.period,t=today();if(p==='mois')return t.slice(0,8)+'01';if(p==='30j')return addDays(t,-29);return ''}
function inP(d){var st=periodStart();return !st||(d>=st&&d<=today())}
function itemQty(it){var q=0;S.mvts.forEach(function(m){if(m.itemId===it.id)q+=m.type==='perte'?-m.qte:m.qte});S.feeds.forEach(function(f){if(f.itemId===it.id)q-=f.kg});return q}
function itemAvg(it){var q=0,v=0;S.mvts.forEach(function(m){if(m.itemId===it.id&&m.type==='achat'&&m.prix>0){q+=m.qte;v+=m.qte*m.prix}});return q>0?v/q:cfg().prixAliment}
function feedCost(f){var it=f.itemId&&find(S.stock,f.itemId);return f.kg*(it?itemAvg(it):cfg().prixAliment)}
function attenteFin(h){return h.delai>0?addDays(h.date,(h.duree||0)+h.delai):null}
function attenteLot(lotId){var t=today(),best=null;S.health.forEach(function(h){if(h.lotId===lotId&&h.type==='traitement'){var f=attenteFin(h);if(f&&f>=t&&(!best||f>best))best=f}});return best}
function lotBilan(l){
  var st=lotStats(l),ca=sum(S.sales.filter(function(s){return s.lotId===l.id}).map(function(s){return{v:salesNet(s)}}),'v');
  var coutAlim=sum(S.feeds.filter(function(f){return f.lotId===l.id}).map(function(f){return{v:feedCost(f)}}),'v');
  var direct=sum(S.expenses.filter(function(x){return x.lotId===l.id}),'montant');
  var communs=sum(S.expenses.filter(function(x){return !x.lotId&&x.cat!=='Aliments'&&x.cat!=='Achat de reproducteurs'}),'montant');
  var tot=sum(S.lots,'initial'),alloc=cfg().repartition==='effectif'&&tot>0?communs*l.initial/tot:0;
  var cout=coutAlim+direct+alloc;
  var vendus=sum(S.sales.filter(function(s){return s.lotId===l.id}),'qte');
  var kgC=sum(S.abattages.filter(function(a){return a.lotId===l.id}),'carcasse');
  return{ca:ca,coutAlim:coutAlim,alimParLapin:vendus>0?coutAlim/vendus:null,alimParKg:kgC>0?coutAlim/kgC:null,direct:direct,alloc:alloc,cout:cout,marge:ca-cout,vendus:vendus,kgC:kgC,
    parLapin:vendus>0?cout/vendus:null,parKg:kgC>0?cout/kgC:null}}
function breedStatus(b){
  var t=today();
  if(b.sevrageDate)return{k:'sevre',l:'Sevrée',c:'good'};
  if(b.miseBas)return{k:'allaitante',l:'Mise bas '+fdate(b.miseBas),c:'good'};
  if(b.palpation==='negatif')return{k:'vide',l:'Non gestante',c:''};
  var prev=addDays(b.saillie,cfg().gestation);
  if(prev<t)return{k:'retard',l:'Mise bas en retard',c:'bad'};
  return{k:'gestante',l:b.palpation==='positif'?'Gestante':'À palper',c:b.palpation==='positif'?'warn':''}}
function alerts(){
  var a=[],t=today(),c=cfg();
  S.breedings.forEach(function(b){
    var f=animalLabel(b.femelle);
    if(!b.miseBas&&b.palpation==='attente'){var dp=addDays(b.saillie,c.palpation);if(dp<=t)a.push({c:'warn',t:'Palpation à faire : '+f,s:'Saillie du '+fdate(b.saillie)+' (prévue le '+fdate(dp)+')'})}
    if(!b.miseBas&&b.palpation!=='negatif'){var mb=addDays(b.saillie,c.gestation),r=diff(mb,t);
      if(r<0)a.push({c:'bad',t:'Mise bas en retard : '+f,s:'Prévue le '+fdate(mb)+' ('+(-r)+' j de retard). Contacter le vétérinaire si besoin.'});
      else if(r<=5)a.push({c:'warn',t:'Mise bas '+(r===0?'attendue aujourd’hui':'dans '+r+' j')+' : '+f,s:'Prévue le '+fdate(mb)+'. Préparer la boîte à nid.'})}
    if(b.miseBas&&!b.sevrageDate){var sv=addDays(b.miseBas,c.sevrage),r2=diff(sv,t);
      if(r2<=3)a.push({c:'info',t:'Sevrage '+(r2<0?'dépassé':r2===0?'aujourd’hui':'dans '+r2+' j')+' : '+f,s:'Prévu le '+fdate(sv)})}});
  S.lots.forEach(function(l){var st=lotStats(l);if(st.present<=0)return;
    if(st.ready)a.push({c:'good',t:'Lot '+l.num+' prêt à la vente',s:'Poids moyen '+gr(st.last.g)+' pour un objectif de '+gr(targetLive())+' (vif)'});
    if(st.sinceWeigh>=c.intervallePesee)a.push({c:'info',t:'Pesée à faire : lot '+l.num,s:'Dernière pesée il y a '+st.sinceWeigh+' j'});
    if(st.mort!=null&&st.mort>=10)a.push({c:'bad',t:'Mortalité élevée : lot '+l.num,s:fpct(st.mort)+' de l’effectif initial'})});
  S.stock.forEach(function(it){var q=itemQty(it);if(it.seuil>0&&q<=it.seuil)a.push({c:q<=0?'bad':'warn',t:'Stock bas : '+it.nom,s:num(q,1)+' '+it.unite+' restants (seuil '+num(it.seuil)+' '+it.unite+')'})});
  S.health.forEach(function(h){if(h.suivi&&!h.done){var r=diff(h.suivi,t);if(r<=2)a.push({c:r<0?'warn':'info',t:'Suivi sanitaire '+(r<0?'en retard':r===0?'aujourd’hui':'dans '+r+' j')+' : '+(h.lotId?'lot '+lotLabel(h.lotId):animalLabel(h.animalId)),s:(h.produit||h.type)+' · prévu le '+fdate(h.suivi)})}});
  S.lots.forEach(function(l){var f=attenteLot(l.id);if(f&&lotStats(l).present>0)a.push({c:'warn',t:'Délai d’attente : lot '+l.num,s:'Ne pas commercialiser avant le '+fdate(addDays(f,1))+'. À confirmer avec la notice ou le vétérinaire.'})});
  var du=sum(S.sales.map(function(s){return{v:salesNet(s)-(Number(s.encaisse)||0)}}),'v');
  if(du>0)a.push({c:'warn',t:'Créances clients : '+money(du),s:S.sales.filter(function(s){return salesNet(s)>s.encaisse}).length+' vente(s) non soldée(s)'});
  var lb=S.lastBackup?diff(t,S.lastBackup.slice(0,10)):null;
  if(!storageOk)a.unshift({c:'bad',t:'Stockage indisponible',s:'Les données ne sont pas conservées. Exporter une sauvegarde maintenant.'});
  else if(lb==null||lb>=7)a.push({c:'info',t:'Sauvegarde conseillée',s:lb==null?'Aucune sauvegarde faite pour l’instant.':'Dernière sauvegarde il y a '+lb+' j.'});
  return a}

function chartSvg(l,s){
  var W=340,H=210,L=44,R=14,T=14,B=30,tg=targetLive(),pts=s.pts;
  var d0=pts[0].date,dEnd=s.est&&!s.ready?s.est:pts[pts.length-1].date;
  if(dEnd===d0)dEnd=addDays(d0,7);
  var span=diff(dEnd,d0),yMax=Math.ceil(Math.max(tg*1.08,s.last.g*1.05)/500)*500,yMin=0;
  var X=function(d){return L+(diff(d,d0)/span)*(W-L-R)},Y=function(g){return H-B-(g-yMin)/(yMax-yMin)*(H-T-B)};
  var o='<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Courbe du poids moyen du lot '+esc(l.num)+' comparée à l’objectif">';
  for(var g=0;g<=yMax;g+=500)o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" style="stroke:var(--line);stroke-width:1"/><text x="'+(L-6)+'" y="'+(Y(g)+4)+'" text-anchor="end">'+g+'</text>';
  o+='<text x="'+L+'" y="'+(H-8)+'" text-anchor="start">'+fdate(d0).slice(0,5)+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+fdate(dEnd).slice(0,5)+'</text>';
  o+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(tg)+'" y2="'+Y(tg)+'" style="stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4"/><text x="'+(L+4)+'" y="'+(Y(tg)-5)+'">Objectif vif '+Math.round(tg)+' g (estimé)</text>';
  if(s.est&&!s.ready)o+='<line x1="'+X(s.last.date)+'" y1="'+Y(s.last.g)+'" x2="'+X(s.est)+'" y2="'+Y(tg)+'" style="stroke:var(--accent);stroke-width:2.5;stroke-dasharray:2 5;stroke-linecap:round"/><circle cx="'+X(s.est)+'" cy="'+Y(tg)+'" r="4" style="fill:var(--bg);stroke:var(--accent);stroke-width:2"/>';
  o+='<polyline points="'+pts.map(function(p){return X(p.date).toFixed(1)+','+Y(p.g).toFixed(1)}).join(' ')+'" style="fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linejoin:round"/>';
  pts.forEach(function(p){o+='<circle cx="'+X(p.date).toFixed(1)+'" cy="'+Y(p.g).toFixed(1)+'" r="3.5" style="fill:var(--brand)"/>'});
  var lp=pts[pts.length-1];o+='<text x="'+Math.min(X(lp.date),W-R-2)+'" y="'+(Y(lp.g)+16)+'" text-anchor="end" style="font-weight:700;fill:var(--ink)">'+Math.round(lp.g)+' g</text>';
  return o+'</svg>'}

function slaughterLive(v){
  if(!v.vif||!v.carcasse)return 'Le rendement s’affichera ici : poids de carcasse ÷ poids vif × 100.';
  var r=pct(v.carcasse,v.vif),k=(v.n||0)-(v.pertes||0),pm=k>0?v.carcasse/k:0;
  return '<b>Rendement carcasse : '+fpct(r)+'</b> (calculé)'+(k>0?'<br>Poids moyen de carcasse : '+num(pm,2)+' kg pour un objectif de '+num(cfg().cibleCarcasse,2)+' kg':'')}
function checkSlaughter(v,cur){
  var l=find(S.lots,v.lotId),room=lotStats(l).present+(cur&&cur.lotId===v.lotId?cur.n:0);
  if(v.n<1)return 'Indiquer au moins 1 lapin.';if(v.n>room)return 'Il ne reste que '+room+' animaux dans ce lot.';
  if(v.vif<=0||v.carcasse<=0)return 'Les poids doivent être positifs.';
  if(v.carcasse>=v.vif)return 'Le poids de carcasse doit être inférieur au poids vif. Vérifier les deux valeurs.';
  if((v.pertes||0)>v.n)return 'Les pertes dépassent le nombre abattu.';return ''}
ACT.slaughter=function(d){
  form('Fiche d’abattage',slaughterFields(),{lotId:d.id||(lotOpts(true)[0]||[''])[0],date:today(),pertes:0},function(v){
    var e=checkSlaughter(v);if(e)return e;v.pertes=v.pertes||0;v.id=uid('ab');S.abattages.push(v);logOp('Abattage '+lotLabel(v.lotId)+' : '+v.n);commit('Abattage enregistré')},
    {live:slaughterLive,intro:'Le poids vif est celui des animaux avant abattage. Le poids de carcasse est mesuré après préparation.'})};
ACT.editSlaughter=function(d){
  var a=find(S.abattages,d.id);
  form('Modifier l’abattage',slaughterFields(),a,function(v){var e=checkSlaughter(v,a);if(e)return e;v.pertes=v.pertes||0;Object.keys(v).forEach(function(k){a[k]=v[k]});logOp('Abattage modifié : '+lotLabel(a.lotId));commit('Abattage mis à jour')},
    {live:slaughterLive,del:function(){confirmSheet('Supprimer cette fiche d’abattage ? Les lapins retournent dans l’effectif du lot.',function(){S.abattages=S.abattages.filter(function(x){return x.id!==a.id});logOp('Abattage supprimé : '+lotLabel(a.lotId));commit('Fiche supprimée')},'Supprimer')}})};

/* ---------- reproduction ---------- */
function perfStats(){
  var t=today(),g=cfg().gestation;
  var closed=S.breedings.filter(function(b){return b.miseBas||b.palpation==='negatif'||addDays(b.saillie,g+3)<t});
  var mb=S.breedings.filter(function(b){return b.miseBas});
  var weaned=S.breedings.filter(function(b){return b.sevrageDate});
  var nes=sum(mb,'nes'),nesW=sum(weaned.map(function(b){return{v:(b.nes||0)+(b.adopt||0)}}),'v'),sev=sum(weaned,'sevres');
  var fem={};S.breedings.forEach(function(b){(fem[b.femelle]=fem[b.femelle]||[]).push(b)});
  return{taux:pct(mb.length,closed.length),nClosed:closed.length,nMB:mb.length,taille:mb.length?nes/mb.length:null,
    mort:nesW>0?pct(nesW-sev,nesW):null,parFemelle:Object.keys(fem).length?sev/Object.keys(fem).length:null,sev:sev,fem:fem}}
function vRepro(){
  var h=seg('repro',[['femelles','Saillies'],['perf','Indicateurs']]);
  if(UI.seg.repro==='femelles'){
    var bs=by(S.breedings,'saillie').reverse();
    h+='<section class="blk"><div class="list">'+(bs.length?bs.map(function(b){var st=breedStatus(b),mb=b.miseBas?'':addDays(b.saillie,cfg().gestation);
      return '<button class="row" data-act="openBreed" data-id="'+b.id+'"><div class="main"><div class="t">'+esc(animalLabel(b.femelle))+'</div><div class="s">Saillie '+fdate(b.saillie)+' avec '+esc(b.male?animalLabel(b.male):'mâle non précisé')+(mb?' · mise bas prévue '+fdate(mb):' · '+b.nes+' nés vivants'+(b.mortNes?', '+b.mortNes+' mort-nés':''))+'</div></div><div class="end">'+pill(st.l,st.c)+'</div></button>'}).join(''):empty('Aucune saillie enregistrée.'))+'</div></section><button class="fab" data-act="newBreed">+ Saillie</button>';
  }else{
    var p=perfStats();
    h+='<section class="blk"><div class="grid">'+kpi(fpct(p.taux),'taux de mise bas ('+p.nMB+' sur '+p.nClosed+')')+kpi(p.taille==null?'—':num(p.taille,1),'nés vivants par portée')+kpi(fpct(p.mort),'mortalité avant sevrage')+kpi(p.parFemelle==null?'—':num(p.parFemelle,1),'sevrés par femelle')+'</div>'+
    '<p class="small">Taux de mise bas : mises bas ÷ saillies terminées (mise bas faite, palpation négative ou terme dépassé de 3 jours). Mortalité avant sevrage : (nés vivants + adoptions − sevrés) ÷ (nés vivants + adoptions), sur les portées déjà sevrées.</p></section>'+
    '<section class="blk"><div class="h2row"><h2>Par femelle</h2></div>'+(Object.keys(p.fem).length?'<div class="card scroll-x"><table><thead><tr><th>Femelle</th><th>Saillies</th><th>Mises bas</th><th>Nés vivants</th><th>Sevrés</th></tr></thead><tbody>'+Object.keys(p.fem).map(function(id){var a=p.fem[id];return '<tr><td><b>'+esc(animalLabel(id))+'</b></td><td>'+a.length+'</td><td>'+a.filter(function(b){return b.miseBas}).length+'</td><td>'+sum(a,'nes')+'</td><td>'+sum(a,'sevres')+'</td></tr>'}).join('')+'</tbody></table></div>':empty('Pas encore de données.'))+'</section>'}
  return h}
ACT.newBreed=function(){

ACT.wean=function(d){

/* ---------- argent : ventes, dépenses, résultats ---------- */
var MODES=[['Espèces','Espèces'],['Mobile money','Mobile money'],['Virement','Virement'],['Chèque','Chèque'],['Crédit','À crédit']];
function stockFor(cat,lotId){var l=find(S.lots,lotId);if(!l)return 0;var s=lotStats(l);return cat==='vif'||cat==='sevre'?s.present:s.carcStock}
function autoPrice(cat,poids){
  var p=cfg().prix,t=cfg().tranches;
  if(cat==='carcasse'){if(!poids)return null;for(var i=0;i<t.length;i++)if(poids>=t[i].min&&poids<t[i].max)return t[i].prix;return t[t.length-1].prix}
  return p[cat]}
function trancheLabel(poids){var t=cfg().tranches;for(var i=0;i<t.length;i++)if(poids>=t[i].min&&poids<t[i].max)return i===0?'moins de '+num(t[0].max,2)+' kg':i===t.length-1?num(t[i].min,2)+' kg et plus':num(t[i].min,2)+' à moins de '+num(t[i].max,2)+' kg';return ''}

    h+='<section class="blk"><div class="h2row"><h2>Autres recettes</h2><button class="btn sm" data-act="newInc">+ Recette</button></div><div class="list">'+(inc.length?inc.map(function(x){return '<button class="row" data-act="editInc" data-id="'+x.id+'"><div class="main"><div class="t">'+esc(x.note||'Autre recette')+'</div><div class="s">'+fdate(x.date)+'</div></div><div class="end">'+money(x.montant)+'</div></button>'}).join(''):'<div class="small">Les ventes de lapins sont comptées automatiquement. Ne saisir ici que les autres recettes (fumier, subvention…).</div>')+'</div></section><button class="fab" data-act="newExp">+ Dépense</button>';
  }else{

    '<p class="small">Coût d’un lot = aliment distribué × prix du kilo (paramètres) + dépenses rattachées au lot + part des charges communes ('+(cfg().repartition==='effectif'?'répartie selon l’effectif initial':'non répartie')+'). Les achats d’aliments et de reproducteurs ne sont pas répartis, pour éviter un double comptage.</p></section>'}
  return h}
function saleFields(){return[
  {k:'date',l:'Date',t:'date',req:1,half:1},{k:'mode',l:'Paiement',t:'select',opts:MODES,half:1},
  {k:'client',l:'Client',half:1},{k:'tel',l:'Téléphone',t:'tel',half:1},

  {k:'lotId',l:'Lot',t:'select',opts:opts(lotOpts(false),'Choisir un lot')},{k:'animalId',l:'Reproducteur vendu',t:'select',opts:opts(animalOpts(''),'Choisir')},
  {k:'qte',l:'Quantité',t:'number',step:'1',req:1,half:1},{k:'poids',l:'Poids moyen de carcasse',hint:'kg',t:'number',half:1},
  {k:'prixUnit',l:'Prix unitaire',hint:'FCFA',t:'number',req:1,half:1},{k:'remise',l:'Remise',hint:'FCFA',t:'number',def:0,half:1},
  {k:'encaisse',l:'Montant encaissé',hint:'FCFA',t:'number',def:0},{k:'resp',l:'Responsable de la vente'},
  {k:'force',l:'Autoriser malgré un stock insuffisant ou un délai d’attente (sera consigné)',t:'chk'}]}
function saleLive(state){return function(v,set,show){
  var c=v.cat;show('lotId',c!=='reproducteur');show('animalId',c==='reproducteur');show('poids',c==='carcasse');
  var ap=autoPrice(c,v.poids),key=c+'|'+(v.poids||'');
  if(ap!=null&&state.key!==key&&(v.prixUnit==null||v.prixUnit===state.auto)){set('prixUnit',ap);v.prixUnit=ap}
  if(ap!=null)state.auto=ap;state.key=key;
  if(c==='reproducteur'&&!v.qte){set('qte',1);v.qte=1}
  var net=(v.qte||0)*(v.prixUnit||0)-(v.remise||0),info='';
  if(c!=='reproducteur'&&v.lotId){var st=stockFor(c,v.lotId)+(state.cur&&state.cur.lotId===v.lotId&&((c==='vif'||c==='sevre')===(state.cur.cat==='vif'||state.cur.cat==='sevre'))?state.cur.qte:0);
    info+='Stock disponible : <b>'+st+'</b>'+(v.qte>st?' <span style="color:var(--bad)">(insuffisant)</span>':'')+'<br>'}
  var at=(c==='vif'||c==='abattu'||c==='carcasse')&&v.lotId?attenteLot(v.lotId):null;
  if(at)info+='<span style="color:var(--bad)">Délai d’attente en cours jusqu’au '+fdate(at)+'. Ne pas vendre pour la consommation avant.</span><br>';
  if(c==='carcasse'&&v.poids)info+='Tranche : '+trancheLabel(v.poids)+'<br>';
  return info+'Total net : <b>'+money(net)+'</b> · reste à encaisser : <b>'+money(net-(v.encaisse||0))+'</b>'}}
function saleSave(cur){return function(v){
  if(v.qte<1||v.qte!==Math.floor(v.qte))return 'La quantité doit être un entier d’au moins 1.';
  if(v.prixUnit<0||(v.remise||0)<0)return 'Prix et remise ne peuvent pas être négatifs.';
  var net=v.qte*v.prixUnit-(v.remise||0);if(net<0)return 'La remise dépasse le montant de la vente.';
  if((v.encaisse||0)>net)return 'Le montant encaissé dépasse le total de la vente.';
  if(v.cat==='carcasse'&&!v.poids)return 'Indiquer le poids moyen de carcasse pour appliquer la bonne tranche.';
  var forced=false;
  if(v.cat==='reproducteur'){if(!v.animalId)return 'Choisir le reproducteur vendu.';if(v.qte!==1)return 'Un reproducteur se vend à l’unité.';v.lotId=''}
  else{if(!v.lotId)return 'Choisir le lot.';v.animalId='';
    var st=stockFor(v.cat,v.lotId)+(cur&&cur.lotId===v.lotId&&((v.cat==='vif'||v.cat==='sevre')===(cur.cat==='vif'||cur.cat==='sevre'))?cur.qte:0);
    if(v.qte>st){if(!v.force)return 'Stock insuffisant : '+st+' disponible. Cocher l’autorisation pour continuer, elle sera consignée.';forced=true}
    var at=(v.cat==='vif'||v.cat==='abattu'||v.cat==='carcasse')?attenteLot(v.lotId):null;

function pp(s){return String(s==null?'':s).replace(/[’‘]/g,"'").replace(/[  ]/g,' ').replace(/[–—−]/g,'-').replace(/[→]/g,'>')}
function pdfLib(){var J=window.jspdf&&window.jspdf.jsPDF;if(!J)toast('PDF indisponible : la bibliothèque ne s’est pas chargée. Reconnectez-vous une fois à Internet.');return J}
function savePdf(name,doc){
  if(!DL){toast('Enregistrement de fichier indisponible ici. Utilisez l’export CSV.');return}
  DL.save({filename:name,data:doc.output('arraybuffer')}).then(function(){toast('PDF prêt')}).catch(function(e){if(!e||e.code!=='declined')toast('Enregistrement impossible')})}
function pdfHead(doc,title,sub,M){doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text(pp(cfg().ferme||'Nouvelle Ferme'),M,16);doc.setFontSize(12);doc.text(pp(title),M,23);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90);doc.text(pp(sub),M,28);doc.setTextColor(0)}
function pdfTable(title,head,rows,w,fname){
  var J=pdfLib();if(!J)return;
  var land=head.length>5,doc=new J({orientation:land?'l':'p',unit:'mm',format:'a4'}),W=land?297:210,H=land?210:297,M=12;
  var tw=sum(w),cw=w.map(function(x){return(W-2*M)*x/tw}),y;
  var sub='Édité le '+fdate(today())+' · '+rows.length+' ligne'+(rows.length>1?'s':'');
  var drawHead=function(){pdfHead(doc,title,sub,M);y=34;doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setFillColor(228,235,226);doc.rect(M,y-4.5,W-2*M,7,'F');var x=M;head.forEach(function(c,i){doc.text(pp(c),x+1,y);x+=cw[i]});y+=6;doc.setFont('helvetica','normal')};
  drawHead();doc.setFontSize(8.5);
  rows.forEach(function(r){
    var cells=r.map(function(c,i){return doc.splitTextToSize(pp(c),cw[i]-2)}),n=Math.max.apply(null,cells.map(function(c){return c.length})),h=n*4+2;
    if(y+h>H-14){doc.addPage();drawHead();doc.setFontSize(8.5)}
    var x=M;cells.forEach(function(c,i){doc.text(c,x+1,y);x+=cw[i]});
    doc.setDrawColor(210);doc.line(M,y+h-3.2,W-M,y+h-3.2);y+=h});
  if(!rows.length){doc.text('Aucune donnée.',M+1,y)}
  var pc=doc.getNumberOfPages();for(var p=1;p<=pc;p++){doc.setPage(p);doc.setFontSize(8);doc.setTextColor(120);doc.text('Page '+p+' / '+pc,W-M,H-8,{align:'right'})}
  savePdf(fname,doc)}

  lots:{t:'Fiches de lots',h:['Lot','Constitué','Initial','Présents','Mortalité','Poids moy. (g)','GMQ (g/j)','Aliment (kg)'],w:[12,14,10,10,12,14,12,12],r:function(){return S.lots.map(function(l){var s=lotStats(l);return[l.num,fdate(l.constitution),l.initial,s.present,fpct(s.mort),num(s.last.g),s.gmq?num(s.gmq,1):'—',num(s.fed,1)]})}},
  bilan:{t:'Bilan de rentabilité par lot',h:['Lot','Ventes','Aliment','Dépenses du lot','Charges communes','Coût total','Résultat','Par lapin vendu','Par kg carcasse'],w:[10,14,14,14,14,14,14,14,14],r:function(){return S.lots.map(function(l){var b=lotBilan(l);return[l.num,num(b.ca),num(b.coutAlim),num(b.direct),num(b.alloc),num(b.cout),num(b.marge),b.parLapin!=null?num(b.parLapin):'—',b.parKg!=null?num(b.parKg):'—']})}},
  abattages:{t:'Fiches d’abattage',h:['Date','Lot','Abattus','Vif (kg)','Carcasse (kg)','Rendement','Pertes'],w:[14,12,12,14,16,14,10],r:function(){return by(S.abattages,'date').map(function(a){return[fdate(a.date),lotLabel(a.lotId),a.n,num(a.vif,2),num(a.carcasse,2),fpct(pct(a.carcasse,a.vif)),a.pertes||0]})}},
  cheptel:{t:'Fiches individuelles',h:['N°','Nom','Sexe','Race','Naissance','Cage','Statut','Poids (g)'],w:[10,14,8,18,12,10,14,10],r:function(){return by(S.animals,'num').map(function(a){return[a.num,a.nom||'—',a.sexe==='F'?'F':'M',a.race||'—',fdate(a.naissance),a.cage||'—',statLabel(a.statut),a.poids?num(a.poids):'—']})}}};
var REPORT_ORDER=['ventes','depenses','bilan','lots','pesees','mortalites','abattages','repro','sante','stock','cheptel'];
ACT.reports=function(){

ACT.invoice=function(d){
  var s=find(S.sales,d.id);if(!s)return;var J=pdfLib();if(!J)return;
  var doc=new J({unit:'mm',format:'a4'}),M=18,W=210,net=salesNet(s),brut=s.qte*s.prixUnit;
  pdfHead(doc,'FACTURE '+s.num,'Date : '+fdate(s.date)+(s.mode?' · Paiement : '+s.mode:''),M);
  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Client',M,42);doc.setFont('helvetica','normal');doc.text(pp(s.client||'Client non précisé'),M,48);if(s.tel)doc.text(pp(s.tel),M,53);
  var y=66;doc.setFillColor(228,235,226);doc.rect(M,y-5,W-2*M,8,'F');doc.setFont('helvetica','bold');doc.setFontSize(9);
  doc.text('Désignation',M+2,y);doc.text('Qté',112,y,{align:'right'});doc.text('Prix unitaire',148,y,{align:'right'});doc.text('Total',W-M-2,y,{align:'right'});
  y+=9;doc.setFont('helvetica','normal');
  var des=CAT_LABEL[s.cat]+(s.cat==='carcasse'&&s.poids?' - '+num(s.poids,2)+' kg ('+trancheLabel(s.poids)+')':'')+(s.lotId?' - lot '+lotLabel(s.lotId):s.animalId?' - '+animalLabel(s.animalId):'');
  var dl=doc.splitTextToSize(pp(des),78);doc.text(dl,M+2,y);doc.text(String(s.qte),112,y,{align:'right'});doc.text(pp(num(s.prixUnit)),148,y,{align:'right'});doc.text(pp(num(brut)),W-M-2,y,{align:'right'});
  y+=dl.length*5+6;doc.setDrawColor(200);doc.line(M,y-4,W-M,y-4);
  var line=function(a,b,bold){doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(bold?11:10);doc.text(pp(a),130,y);doc.text(pp(b),W-M-2,y,{align:'right'});y+=bold?8:6};
  line('Total brut',money(brut));if(s.remise)line('Remise','- '+money(s.remise));line('Net à payer',money(net),true);line('Encaissé',money(s.encaisse));line('Reste à payer',money(net-s.encaisse),true);
  if(s.resp){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90);doc.text('Vente enregistrée par : '+pp(s.resp),M,y+10);doc.setTextColor(0)}
  doc.setFontSize(8);doc.setTextColor(120);doc.text('Document établi avec Nouvelle Ferme Cuniculture Pro',M,285);
  savePdf('facture-'+s.num+'.pdf',doc)};

/* ---------- paramètres, sauvegarde, export ---------- */
function mimeOf(n){var e=(n.split('.').pop()||'').toLowerCase();return{json:'application/json',csv:'text/csv;charset=utf-8',pdf:'application/pdf',txt:'text/plain'}[e]||'application/octet-stream'}
function stdSave(req){return new Promise(function(res,rej){
  var blob=req.data instanceof Blob?req.data:new Blob([req.data],{type:mimeOf(req.filename)}),file=null;
  try{file=new File([blob],req.filename,{type:mimeOf(req.filename)})}catch(e){}
  var anchor=function(){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=req.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);res({status:'saved'})};
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:req.filename}).then(function(){res({status:'saved'})}).catch(function(e){if(e&&e.name==='AbortError')rej({code:'declined'});else anchor()})}
  else anchor()})}
var DL={save:stdSave};
function showText(title,text,intro){openSheet('<h2>'+esc(title)+'</h2><p class="small">'+intro+'</p><textarea id="outText" readonly style="min-height:180px;font-size:12px">'+esc(text)+'</textarea><div class="btns"><button class="btn pri" data-act="selText">Tout sélectionner</button><button class="btn" data-act="close">Fermer</button></div>')}
ACT.selText=function(){var t=$('#outText');t.focus();t.select()};
function saveFile(name,data,onOk){
  if(DL){DL.save({filename:name,data:data}).then(function(){toast('Fichier prêt');if(onOk)onOk()}).catch(function(e){if(e&&e.code==='declined')return;fallbackText(name,data,onOk)})}
  else fallbackText(name,data,onOk)}
function fallbackText(name,data,onOk){
  var done=function(){if(onOk)onOk()};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(data).then(function(){toast('Contenu copié. Collez-le dans une note ou un message.');done()}).catch(function(){showText(name,data,'La copie automatique est refusée. Sélectionnez le texte puis copiez-le.')})}
  else showText(name,data,'Sélectionnez le texte puis copiez-le.')}
function csv(rows){return '﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(';')}).join('\n')}
var EXPORTS={
  ventes:function(){return csv([['Numéro','Date','Client','Catégorie','Lot','Quantité','Poids carcasse (kg)','Prix unitaire (FCFA)','Remise (FCFA)','Total net (FCFA)','Encaissé (FCFA)','Solde (FCFA)','Paiement','Responsable']].concat(by(S.sales,'date').map(function(s){return[s.num,s.date,s.client,CAT_LABEL[s.cat],s.lotId?lotLabel(s.lotId):animalLabel(s.animalId),s.qte,s.poids,s.prixUnit,s.remise,salesNet(s),s.encaisse,salesNet(s)-s.encaisse,s.mode,s.resp]})))},
  depenses:function(){return csv([['Date','Catégorie','Montant (FCFA)','Lot','Note']].concat(by(S.expenses,'date').map(function(x){return[x.date,x.cat,x.montant,x.lotId?lotLabel(x.lotId):'Charge commune',x.note]})))},
  pesees:function(){return csv([['Date','Lot ou animal','Animaux pesés','Poids moyen (g)']].concat(by(S.weighings,'date').map(function(w){return[w.date,w.lotId?lotLabel(w.lotId):animalLabel(w.animalId),w.n||'',w.g]})))},
  mortalites:function(){return csv([['Date','Lot ou animal','Nombre','Cause']].concat(by(S.events.filter(function(e){return e.type==='mort'}),'date').map(function(e){return[e.date,e.lotId?lotLabel(e.lotId):animalLabel(e.animalId),e.n,e.cause]})))}};
ACT.exp=function(d){saveFile(d.k+'-'+today()+'.csv',EXPORTS[d.k]())};
ACT.backup=function(){saveFile('sauvegarde-nouvelle-ferme-'+today()+'.json',JSON.stringify(S),function(){S.lastBackup=new Date().toISOString();save();render()})};
function restoreFrom(text){
  var o;try{o=JSON.parse(text)}catch(e){return toast('Fichier illisible')}
  if(!o||o.v!==1||!Array.isArray(o.animals)||!Array.isArray(o.lots)||!o.settings)return toast('Ce fichier n’est pas une sauvegarde valide');
  confirmSheet('Remplacer toutes les données actuelles par cette sauvegarde ('+o.animals.length+' animaux, '+o.lots.length+' lots, '+(o.sales||[]).length+' ventes) ?',function(){
    var d=defaults();Object.keys(d).forEach(function(k){if(o[k]===undefined)o[k]=d[k]});S=o;logOp('Sauvegarde restaurée');commit('Sauvegarde restaurée')},'Restaurer')}
document.addEventListener('change',function(e){
  if(e.target.id!=='restoreFile')return;var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){restoreFrom(String(r.result))};r.onerror=function(){toast('Lecture impossible')};r.readAsText(f)});
ACT.restorePaste=function(){var t=$('#pasteBox');if(t&&t.value.trim())restoreFrom(t.value);else toast('Collez d’abord la sauvegarde')};
ACT.settings=function(){
  var lb=S.lastBackup?'le '+fdate(S.lastBackup.slice(0,10)):'jamais';
  var h='<h2>Paramètres et sauvegarde</h2><div class="btns"><button class="btn pri" data-act="editSettings">Modifier les paramètres</button></div>'+
  '<h3 style="margin-top:18px;font-size:16px">Sauvegarde</h3><p class="small">Les données sont enregistrées sur cet appareil et restent disponibles sans Internet. Dernière sauvegarde : '+lb+'. Faites-en une régulièrement : si les données du navigateur sont effacées, elles sont perdues.</p>'+
  '<div class="btns"><button class="btn" data-act="backup">Exporter une sauvegarde</button><label class="btn" style="display:inline-flex;align-items:center">Restaurer un fichier<input type="file" id="restoreFile" accept=".json,application/json" hidden></label></div>'+
  '<details style="margin-top:10px"><summary class="small">Restaurer en collant le texte</summary><textarea id="pasteBox" placeholder="Collez ici le contenu de la sauvegarde" style="margin-top:8px"></textarea><div class="btns"><button class="btn sm" data-act="restorePaste">Restaurer</button></div></details>'+
  '<h3 style="margin-top:18px;font-size:16px">Rapports</h3><p class="small">Ventes, dépenses, bilan par lot, pesées, mortalités, reproduction, santé, stock et fiches, en PDF ou en CSV.</p><div class="btns"><button class="btn" data-act="reports">Ouvrir les rapports</button></div>'+
  '<h3 style="margin-top:18px;font-size:16px">Journal des opérations</h3>'+(S.log.length?'<div class="card">'+S.log.slice(0,12).map(function(x){return kv(esc(x.t),'<span class="small">'+fdate(x.d.slice(0,10))+'</span>')}).join('')+'</div>':'<div class="small">Rien d’enregistré pour l’instant.</div>')+
  '<div class="btns"><button class="btn" data-act="close">Fermer</button></div>';
  openSheet(h)};
ACT.editSettings=function(){
  var c=cfg(),t=c.tranches;
  var f=[{k:'ferme',l:'Nom de la ferme'},{k:'cibleCarcasse',l:'Poids de carcasse visé',hint:'kg',t:'number',req:1,half:1},{k:'rendement',l:'Rendement attendu',hint:'%',t:'number',req:1,half:1},
    {k:'gestation',l:'Gestation',hint:'jours',t:'number',step:'1',req:1,half:1},{k:'palpation',l:'Palpation après',hint:'jours',t:'number',step:'1',req:1,half:1},
    {k:'sevrage',l:'Sevrage après',hint:'jours',t:'number',step:'1',req:1,half:1},{k:'intervallePesee',l:'Pesée tous les',hint:'jours',t:'number',step:'1',req:1,half:1},
    {k:'prixAliment',l:'Prix de l’aliment',hint:'FCFA par kg',t:'number',req:1},
    {k:'repartition',l:'Charges communes',t:'select',opts:[['effectif','Réparties selon l’effectif initial des lots'],['aucune','Non réparties entre les lots']]},
    {k:'p_vif',l:'Prix lapin vivant',hint:'FCFA',t:'number',half:1},{k:'p_abattu',l:'Prix lapin abattu',hint:'FCFA',t:'number',half:1},
    {k:'p_reproducteur',l:'Prix reproducteur',hint:'FCFA',t:'number',half:1},{k:'p_sevre',l:'Prix lapereau sevré',hint:'FCFA',t:'number',half:1},
    {k:'t1',l:'Tranche 1 : moins de',hint:'kg',t:'number',half:1},{k:'q1',l:'Prix tranche 1',hint:'FCFA',t:'number',half:1},
    {k:'t2',l:'Tranche 2 : moins de',hint:'kg',t:'number',half:1},{k:'q2',l:'Prix tranche 2',hint:'FCFA',t:'number',half:1},
    {k:'t3',l:'Tranche 3 : moins de',hint:'kg',t:'number',half:1},{k:'q3',l:'Prix tranche 3',hint:'FCFA',t:'number',half:1},
    {k:'q4',l:'Prix tranche 4 (au-delà)',hint:'FCFA',t:'number'}];
  var v={ferme:c.ferme,cibleCarcasse:c.cibleCarcasse,rendement:c.rendement,gestation:c.gestation,palpation:c.palpation,sevrage:c.sevrage,intervallePesee:c.intervallePesee,prixAliment:c.prixAliment,repartition:c.repartition,
    p_vif:c.prix.vif,p_abattu:c.prix.abattu,p_reproducteur:c.prix.reproducteur,p_sevre:c.prix.sevre,t1:t[0].max,q1:t[0].prix,t2:t[1].max,q2:t[1].prix,t3:t[2].max,q3:t[2].prix,q4:t[3].prix};
  form('Paramètres',f,v,function(x){
    if(x.rendement<20||x.rendement>90)return 'Le rendement attendu doit rester entre 20 et 90 %.';
    if(!(x.t1>0&&x.t2>x.t1&&x.t3>x.t2))return 'Les limites de tranches doivent être croissantes.';
    c.ferme=x.ferme||c.ferme;c.cibleCarcasse=x.cibleCarcasse;c.rendement=x.rendement;c.gestation=x.gestation;c.palpation=x.palpation;c.sevrage=x.sevrage;c.intervallePesee=x.intervallePesee;c.prixAliment=x.prixAliment;c.repartition=x.repartition;
    c.prix={vif:x.p_vif||0,abattu:x.p_abattu||0,reproducteur:x.p_reproducteur||0,sevre:x.p_sevre||0};
    c.tranches=[{min:0,max:x.t1,prix:x.q1||0},{min:x.t1,max:x.t2,prix:x.q2||0},{min:x.t2,max:x.t3,prix:x.q3||0},{min:x.t3,max:99,prix:x.q4||0}];
    logOp('Paramètres modifiés');commit('Paramètres enregistrés')},
    {intro:'Les prix et tranches affichés au départ sont des exemples. Remplacez-les par vos tarifs réels.'})};

window.addEventListener('online',render);window.addEventListener('offline',render);
$('#gear').addEventListener('click',ACT.settings);
save();render();
})();
